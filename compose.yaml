services:
  orbita:
    build:
      context: .
      dockerfile: Dockerfile.server
    restart: unless-stopped
    environment:
      ORBITA_CODE: ${ORBITA_CODE:?Defina ORBITA_CODE no arquivo .env}
      ICE_SERVERS: ${ICE_SERVERS:-}
    ports:
      - "127.0.0.1:${ORBITA_PORT:-3000}:3000"
    volumes:
      - orbita-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  orbita-data:
